<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MAAME - Official Archive</title>
  <style>
    /* Full screen centering container */
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: "Times New Roman", Times, Georgia, serif;
      
      /* Flexbox centering */  
      display: flex;
      justify-content: center; /* Horizontally center */
      align-items: center;     /* Vertically center */
      text-align: center;
    }

    /* Custom Header Font Setup */
    @font-face {
      font-family: 'HeaderFont';
      src: url('custom-font.ttf') format('truetype');
    }

    .header-container {
      max-width: 600px;
      padding: 20px;
    }

    .header-title {
      font-family: 'HeaderFont', "Times New Roman", serif;
      font-size: 52px;
      margin: 0;
      letter-spacing: 4px;
    }

    /* Timestamp line */
    .last-updated {
      font-style: italic;
      color: #555555;
      font-size: 13px;
      margin-top: 6px;
      margin-bottom: 25px;
    }

    /* Retro Nav Box */
    .nav-box {
      border-top: 1px solid #111111;
      border-bottom: 1px solid #111111;
      padding: 10px 0;
      font-size: 13px;
      letter-spacing: 2px;
    }

    a:link { color: #cc0000; text-decoration: underline; }
    a:visited { color: #880000; }
    a:hover { color: #000000; }
  </style>
</head>
<body>

  <div class="header-container">
    <!-- Centered Title -->
    <h1 class="header-title">M A A M E</h1>

    <!-- Project Subheading -->
    <div class="project-title">surviving</div>

    <!-- Timestamp -->
    <div class="last-updated">last updated: September 3rd</div>

    <!-- Navigation Below Title -->
    <div class="nav-box">
      [ <a href="#news">NEWS</a> ] &nbsp;&nbsp;
      [ <a href="#about">ABOUT</a> ] &nbsp;&nbsp;
      [ <a href="#music">DISCOGRAPHY</a> ] &nbsp;&nbsp;
      [ <a href="#links">CONNECT</a> ]
    </div>
  </div>

</body>
</html>
