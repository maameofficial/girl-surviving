<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAAME &bull; Social Connections</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
            line-height: 1.6;
        }
        h1 {
            font-size: 16px;
            letter-spacing: 3px;
            font-weight: normal;
            margin-bottom: 30px;
            border-bottom: 1px solid #333333;
            padding-bottom: 15px;
        }
        .social-icons {
            margin: 50px 0;
        }
        .social-icons a {
            margin: 0 15px;
            text-decoration: none;
        }
        .social-icons img {
            width: 28px;
            height: 28px;
            border: 0;
            vertical-align: middle;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }
        .social-icons img:hover {
            opacity: 1.0;
        }
        a {
            color: #ffffff !important;
            text-decoration: underline;
        }
        a:hover {
            color: #aaaaaa !important;
        }
        .footer-nav {
            margin-top: 50px;
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>&bull; SOCIAL CONNECTIONS &bull;</h1>

    <p style="font-size: 13px; color: #aaaaaa; margin-bottom: 30px;">
        Direct transmission channels.
    </p>

    <div class="social-icons">
        <!-- Instagram Icon Link -->
        <a href="https://instagram.com/YOUR_HANDLE" target="_blank" rel="noopener" title="Instagram">
            <img src="instagram-icon.png" alt="Instagram">
        </a>

        <!-- TikTok Icon Link -->
        <a href="https://tiktok.com/@YOUR_HANDLE" target="_blank" rel="noopener" title="TikTok">
